<script>
'use strict';
const W = 1600, H = 900;
const C = {
  navy: '#163B65', blue: '#347BC1', gold: '#D5B96F', rose: '#C98078',
  pale: '#EAF2FA', paleRose: '#F3E4E1', line: '#CFDCE8', text: '#243445',
  grey: '#64748B', neutral: '#8A99A8', white: '#FFFFFF', paleGold: '#F7F0DE'
};
const FONT = '"Microsoft YaHei","微软雅黑","PingFang SC","Noto Sans SC",sans-serif';
const canvas = document.getElementById('deck');
let ctx = canvas.getContext('2d');

/* ---------- drawing primitives ---------- */
function font(size, bold) { ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; }
function rect(x, y, w, h, fill, stroke, lw = 2) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw); }
}
function text(s, x, y, o = {}) {
  const { size = 26, bold = false, color = C.text, align = 'left', base = 'top' } = o;
  font(size, bold); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function line(x1, y1, x2, y2, color = C.line, lw = 2, dash) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, color = C.blue, lw = 4, head = 14) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  line(x1, y1, x2 - Math.cos(a) * head * 0.8, y2 - Math.sin(a) * head * 0.8, color, lw);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(a - 0.45), y2 - head * Math.sin(a - 0.45));
  ctx.lineTo(x2 - head * Math.cos(a + 0.45), y2 - head * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}
function circle(x, y, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// Wraps by character (CJK-safe) while keeping latin words intact; returns bottom y.
function wrap(s, x, y, maxW, o = {}) {
  const { size = 24, bold = false, color = C.text, lh = 1.5, align = 'left' } = o;
  font(size, bold); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  const tokens = s.match(/[A-Za-z0-9.%+\-−–×/()'_:,]+|\s+|./g) || [];
  let cur = '', yy = y;
  const flush = () => { ctx.fillText(cur.trim(), x, yy); yy += size * lh; cur = ''; };
  for (const t of tokens) {
    const noBreakBefore = /^[，。；：、）》”！？,.;:)]$/.test(t);
    if (ctx.measureText(cur + t).width > maxW && cur.trim() && !noBreakBefore) flush();
    cur += t;
  }
  if (cur.trim()) flush();
  return yy;
}
// Rich line: segments [[text, {color,bold}], ...]
function rich(segs, x, y, size = 24) {
  let xx = x;
  for (const [s, o = {}] of segs) xx += text(s, xx, y, { size, ...o });
  return xx;
}
// Renders "_X" (one char, or {..}) as a subscript.
function formula(s, x, y, size, color, bold = true) {
  const parts = s.split(/(_\{[^}]*\}|_.)/);
  let xx = x;
  for (const p of parts) {
    if (!p) continue;
    if (p[0] === '_') {
      const sub = p[1] === '{' ? p.slice(2, -1) : p[1];
      xx += text(sub, xx, y + size * 0.42, { size: size * 0.62, bold, color });
    } else xx += text(p, xx, y, { size, bold, color });
  }
  return xx;
}
function title(s) { text(s, 84, 52, { size: 40, bold: true, color: C.navy }); }
function pageNo(n) { text(String(n), 1516, 828, { size: 18, color: C.grey, align: 'right' }); }
function panel(x, y, w, h, head, fill = C.navy, headH = 56) {
  rect(x, y + headH, w, h - headH, C.white, C.line, 2);
  rect(x, y, w, headH, fill);
  text(head, x + w / 2, y + headH / 2, { size: 25, bold: true, color: C.white, align: 'center', base: 'middle' });
}
function band(s, y = 730, h = 70, x = 84, w = 1432) {
  rect(x, y, w, h, C.pale);
  text(s, x + w / 2, y + h / 2, { size: 27, bold: true, color: C.navy, align: 'center', base: 'middle' });
}
function caption(s, y = 812) { text(s, W / 2, y, { size: 18, color: C.grey, align: 'center' }); }
function chip(s, x, y, w, h, o = {}) {
  const { fill = C.pale, color = C.navy, size = 22, stroke = null, bold = true } = o;
  rect(x, y, w, h, fill, stroke, 2);
  text(s, x + w / 2, y + h / 2, { size, bold, color, align: 'center', base: 'middle' });
}
function bullet(s, x, y, maxW, o = {}) {
  const { size = 23, color = C.text, dot = C.blue } = o;
  rect(x, y + size * 0.5, 9, 9, dot);
  return wrap(s, x + 24, y, maxW - 24, { size, color, lh: 1.45 });
}
function numTag(n, x, y, fill = C.blue, r = 22) {
  circle(x, y, r, fill);
  text(String(n), x, y + 1, { size: r * 0.95, bold: true, color: C.white, align: 'center', base: 'middle' });
}
const MODS = [
  ['E', '执行', 'Execution', '#163B65'], ['T', '工具', 'Tools', '#347BC1'],
  ['C', '上下文', 'Context', '#4F9AD6'], ['S', '状态', 'State', '#C98078'],
  ['L', '生命周期', 'Lifecycle', '#B39552'], ['V', '验证', 'Verification', '#5B7A99']
];
const CREATORS = ['Opus 4.8', 'GPT-5.5', 'Gemini 3.1 Pro', 'DeepSeek V4 Pro', 'Qwen 3.7 Max', 'Seed 2.0 Pro'];

/* ---------- SVG illustration kit ---------- */
const SVG_FONT = 'Microsoft YaHei, 微软雅黑, PingFang SC, Noto Sans SC, sans-serif';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function el(tag, a = {}, inner = '') {
  const attrs = Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ');
  return inner === null ? `<${tag} ${attrs}/>` : `<${tag} ${attrs}>${inner}</${tag}>`;
}
function measure(s, size, bold) { font(size, bold); return ctx.measureText(s).width; }
const S = {
  // "_X" or "_{..}" renders as a subscript.
  text(s, x, y, { size = 20, bold = false, color = C.text, anchor = 'middle' } = {}) {
    const inner = String(s).split(/(_\{[^}]*\}|_[A-Za-z0-9])/).filter(Boolean).map(p => p[0] === '_'
      ? `<tspan font-size="${size * 0.65}" dy="${size * 0.28}">${esc(p[1] === '{' ? p.slice(2, -1) : p[1])}</tspan><tspan dy="${-size * 0.28}">​</tspan>`
      : esc(p)).join('');
    return el('text', { x, y, 'font-family': SVG_FONT, 'font-size': size, 'font-weight': bold ? 700 : 400,
      fill: color, 'text-anchor': anchor, 'dominant-baseline': 'central' }, inner);
  },
  pill(s, cx, cy, { size = 18, fill = C.navy, color = C.white, stroke = 'none', padX = 20, h = 38, bold = true, shadow = false } = {}) {
    const w = measure(s, size, bold) + padX * 2;
    return el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: h / 2, fill, stroke, 'stroke-width': 2, filter: shadow ? 'url(#sh)' : 'none' }, null)
      + S.text(s, cx, cy, { size, bold, color });
  },
  halo(cx, cy, r, fill = C.pale) {
    return el('circle', { cx, cy, r, fill, filter: 'url(#sh)' }, null)
      + el('circle', { cx, cy, r: r - 10, fill: 'none', stroke: C.white, 'stroke-width': 2, opacity: 0.7 }, null);
  },
  arrow(x1, y1, x2, y2, { color = C.blue, w = 3.5, dash = null, curve = null } = {}) {
    const d = curve ? `M${x1},${y1} Q${curve[0]},${curve[1]} ${x2},${y2}` : `M${x1},${y1} L${x2},${y2}`;
    return el('path', { d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round',
      'stroke-dasharray': dash || 'none', 'marker-end': `url(#ah-${color.slice(1)})` }, null);
  },
  robot(cx, cy, s = 1, { chest = null, accent = C.blue } = {}) {
    const k = v => v * s, st = { stroke: C.navy, 'stroke-width': 3, 'stroke-linejoin': 'round' };
    return [
      el('line', { x1: cx, y1: cy - k(46), x2: cx, y2: cy - k(34), ...st }, null),
      el('circle', { cx, cy: cy - k(50), r: k(6), fill: accent, ...st }, null),
      el('rect', { x: cx - k(44), y: cy - k(18), width: k(10), height: k(22), rx: k(4), fill: accent, ...st }, null),
      el('rect', { x: cx + k(34), y: cy - k(18), width: k(10), height: k(22), rx: k(4), fill: accent, ...st }, null),
      el('rect', { x: cx - k(36), y: cy - k(34), width: k(72), height: k(54), rx: k(18), fill: C.white, ...st }, null),
      el('rect', { x: cx - k(25), y: cy - k(23), width: k(50), height: k(30), rx: k(12), fill: C.navy }, null),
      el('circle', { cx: cx - k(11), cy: cy - k(8), r: k(5), fill: '#9FD4FF' }, null),
      el('circle', { cx: cx + k(11), cy: cy - k(8), r: k(5), fill: '#9FD4FF' }, null),
      el('path', { d: `M${cx - k(30)},${cy + k(56)} Q${cx - k(30)},${cy + k(26)} ${cx},${cy + k(26)} Q${cx + k(30)},${cy + k(26)} ${cx + k(30)},${cy + k(56)} Z`, fill: C.white, ...st }, null),
      chest ? S.text(chest, cx, cy + k(42), { size: k(15), bold: true, color: accent }) : ''
    ].join('');
  },
  doc(x, y, w, h, { stroke = C.navy, fill = C.white, dash = null, lines = 3, lineColor = C.blue } = {}) {
    const f = Math.min(w, h) * 0.28;
    let out = el('path', { d: `M${x},${y} H${x + w - f} L${x + w},${y + f} V${y + h} H${x} Z`, fill, stroke, 'stroke-width': 3,
      'stroke-linejoin': 'round', 'stroke-dasharray': dash || 'none' }, null)
      + el('path', { d: `M${x + w - f},${y} V${y + f} H${x + w}`, fill: 'none', stroke, 'stroke-width': 3, 'stroke-linejoin': 'round' }, null);
    for (let i = 0; i < lines; i++) {
      const ly = y + h * (0.42 + i * 0.18), lw = (w - 24) * (i === lines - 1 ? 0.55 : 1);
      out += el('line', { x1: x + 12, y1: ly, x2: x + 12 + lw, y2: ly, stroke: lineColor, 'stroke-width': 4, 'stroke-linecap': 'round',
        'stroke-dasharray': dash ? '6 7' : 'none' }, null);
    }
    return out;
  },
  lock(cx, cy, s = 1, color = C.navy, body = C.white) {
    const k = v => v * s;
    return el('path', { d: `M${cx - k(8)},${cy - k(2)} V${cy - k(8)} A${k(8)},${k(8)} 0 0 1 ${cx + k(8)},${cy - k(8)} V${cy - k(2)}`,
      fill: 'none', stroke: color, 'stroke-width': k(3.2), 'stroke-linecap': 'round' }, null)
      + el('rect', { x: cx - k(12), y: cy - k(3), width: k(24), height: k(18), rx: k(4), fill: body, stroke: color, 'stroke-width': k(3) }, null)
      + el('circle', { cx, cy: cy + k(6), r: k(2.6), fill: color }, null);
  },
  eye(cx, cy, s = 1, color = C.blue) {
    const k = v => v * s;
    return el('path', { d: `M${cx - k(16)},${cy} Q${cx},${cy - k(14)} ${cx + k(16)},${cy} Q${cx},${cy + k(14)} ${cx - k(16)},${cy} Z`,
      fill: C.white, stroke: color, 'stroke-width': k(3), 'stroke-linejoin': 'round' }, null)
      + el('circle', { cx, cy, r: k(5), fill: color }, null);
  },
  check(cx, cy, r, color = C.blue) {
    return el('circle', { cx, cy, r, fill: color, stroke: C.white, 'stroke-width': 3 }, null)
      + el('path', { d: `M${cx - r * 0.45},${cy} L${cx - r * 0.1},${cy + r * 0.35} L${cx + r * 0.5},${cy - r * 0.35}`,
        fill: 'none', stroke: C.white, 'stroke-width': 3.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, null);
  },
  defs() {
    const marks = [C.blue, C.gold, C.neutral, C.navy].map(c => el('marker', { id: `ah-${c.slice(1)}`, viewBox: '0 0 10 10', refX: 7, refY: 5,
      markerWidth: 4.5, markerHeight: 4.5, orient: 'auto-start-reverse' }, el('path', { d: 'M0,0 L10,5 L0,10 Z', fill: c }, null))).join('');
    return el('defs', {}, marks + el('filter', { id: 'sh', x: '-20%', y: '-20%', width: '140%', height: '150%' },
      el('feDropShadow', { dx: 0, dy: 5, stdDeviation: 7, 'flood-color': C.navy, 'flood-opacity': 0.13 }, null)));
  },
  wrap(w, h, body) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w * 2}" height="${h * 2}" viewBox="0 0 ${w} ${h}">${S.defs()}${body}</svg>`;
  }
};
// Rasterised once per illustration; the slide redraws when its image finishes loading.
const ILLUS = {};
function illustration(key, w, h, build) {
  if (!ILLUS[key]) {
    const svg = S.wrap(w, h, build());
    const img = new Image();
    ILLUS[key] = { svg, img, ready: false };
    img.onload = () => { ILLUS[key].ready = true; render(); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  return ILLUS[key];
}
function drawIllustration(key, x, y, w, h, build) {
  const il = illustration(key, w, h, build);
  if (il.ready) ctx.drawImage(il.img, x, y, w, h);
}

const slides = [];

slides.push(() => {

/* Slide 3 illustration, in slide pixels (origin at x=84, y=136). */
function overviewSvg() {
  const o = [];
  const zone = (x, y, w, h, fill = '#F5F9FD', stroke = C.line) =>
    el('rect', { x, y, width: w, height: h, rx: 18, fill, stroke, 'stroke-width': 2 }, null);
  const row = (labels, cx, cy, opt) => {
    const gap = 8, ws = labels.map(s => measure(s, opt.size, opt.bold) + opt.padX * 2);
    let x = cx - (ws.reduce((a, b) => a + b, 0) + gap * (labels.length - 1)) / 2;
    return labels.map((s, i) => { const r = S.pill(s, x + ws[i] / 2, cy, opt); x += ws[i] + gap; return r; }).join('');
  };

  // ---- left: existing benchmarks ----
  o.push(zone(0, 14, 430, 506));
  o.push(S.pill('现有 Agent 评测', 215, 14, { size: 21, fill: C.neutral, h: 44, padX: 26, shadow: true }));
  o.push(row(['SWE-bench', 'GAIA', 'WebArena', 'τ-bench'], 215, 78, { size: 15, fill: C.white, color: C.grey, stroke: C.line, padX: 12, h: 30, bold: true }));
  o.push(el('rect', { x: 28, y: 122, width: 374, height: 258, rx: 16, fill: C.white, stroke: C.neutral, 'stroke-width': 2.5, 'stroke-dasharray': '9 7' }, null));
  o.push(S.pill('固定 Harness', 215, 122, { size: 16, fill: C.white, color: C.grey, stroke: C.neutral, h: 32, padX: 14 }));
  o.push(row(['tools', 'context', 'memory', 'loop', 'verify'], 215, 168, { size: 14, fill: '#EEF1F5', color: C.grey, padX: 10, h: 28, bold: false }));
  o.push(S.lock(390, 124, 0.75, C.neutral));
  o.push(S.halo(118, 272, 64, C.pale));
  o.push(S.robot(118, 268, 0.95, { accent: C.neutral }));
  o.push(S.text('Agent', 118, 356, { size: 16, bold: true, color: C.grey }));
  o.push(S.arrow(196, 272, 252, 272, { color: C.neutral }));
  o.push(S.doc(266, 228, 74, 90, { stroke: C.neutral, lineColor: C.line }));
  o.push(S.text('单个任务', 303, 342, { size: 16, color: C.grey }));
  o.push(S.arrow(303, 384, 303, 418, { color: C.neutral }));
  o.push(S.pill('被评对象：答案', 215, 452, { size: 20, fill: C.white, color: C.navy, stroke: C.line, h: 44, padX: 22, shadow: true }));
  o.push(S.text('外壳只是固定的实验配置', 215, 496, { size: 16, color: C.grey }));

/* line chart helper */
function lineChart(x, y, w, h, series, o) {
  const { ymax, ymin = 0, xmax = 10, yticks, label } = o;
  const sx = i => x + w * i / xmax, sy = v => y + h - h * (v - ymin) / (ymax - ymin);
  yticks.forEach(t => { line(x, sy(t), x + w, sy(t), C.line, 1.2); text(String(t), x - 8, sy(t), { size: 14, color: C.grey, align: 'right', base: 'middle' }); });
  for (let i = 0; i <= xmax; i += 2) text('H' + i, sx(i), y + h + 8, { size: 14, color: C.grey, align: 'center' });
  line(x, y + h, x + w, y + h, C.grey, 1.5);
  if (label) text(label, x + w / 2, y - 30, { size: 19, bold: true, color: C.navy, align: 'center' });
  series.forEach(s => {
    ctx.save(); ctx.strokeStyle = s.color; ctx.lineWidth = s.lw || 3.5; if (s.dash) ctx.setLineDash(s.dash);
    ctx.globalAlpha = s.alpha || 1;
    ctx.beginPath(); s.v.forEach((v, i) => i ? ctx.lineTo(sx(i), sy(v)) : ctx.moveTo(sx(i), sy(v))); ctx.stroke(); ctx.restore();
    s.v.forEach((v, i) => { if (!s.dash) circle(sx(i), sy(v), 3.5, s.color); });
    if (s.star != null) star(sx(s.star), sy(s.v[s.star]), 11, s.color);
  });
}
function star(x, y, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = C.white; ctx.lineWidth = 1.5; ctx.stroke();
}

/* ---------- runtime ---------- */
let cur = 0;
// ?export renders the bare slide edge-to-edge (used for screenshot-based PPTX export).
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) { document.getElementById('hint').remove(); canvas.style.boxShadow = 'none'; }
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * (document.fullscreenElement || EXPORT ? 1 : 0.96);
  canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px';
  canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  render();
}
function render() {
  ctx.save(); ctx.fillStyle = C.white; ctx.fillRect(0, 0, W, H); ctx.restore();
  slides[cur](cur + 1);
  canvas.setAttribute('aria-label', `幻灯片 ${cur + 1} / ${slides.length}`);
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (_) { /* file:// in some browsers */ }
}
function go(i) { cur = Math.max(0, Math.min(slides.length - 1, i)); render(); }
function exportPNG() {
  const off = document.createElement('canvas'); off.width = W * 2; off.height = H * 2;
  const main = ctx;
  ctx = off.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0);
  try { ctx.fillStyle = C.white; ctx.fillRect(0, 0, W, H); slides[cur](cur + 1); }
  finally { ctx = main; }
  const a = document.createElement('a'); a.download = `harnessdev-${String(cur + 1).padStart(2, '0')}.png`; a.href = off.toDataURL('image/png'); a.click();
}
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 's' || e.key === 'S') exportPNG();
});
canvas.addEventListener('click', e => { const r = canvas.getBoundingClientRect(); go(cur + (e.clientX - r.left < r.width / 3 ? -1 : 1)); });
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);
cur = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
